global:
  nodeSelector:
    workload: application
    kubernetes.io/arch: arm64
  tolerations:
    - key: workload
      value: application
      effect: NoSchedule 

# values-argocd.yaml (staging)
# configs:
#   cm:
#     application:
#       instanceLabelKey: argocd.argoproj.io/staging-instance 

configs:
  params:
    create: true
    application.instanceLabelKey: argocd.argoproj.io/staging-instance
  
  rbac:
    scopes: "[groups, email]"