global:
  domain: argo-aws.staging.viewlift.com
  nodeSelector:
    workload: application
    kubernetes.io/arch: arm64
  tolerations:
    - key: workload
      value: application
      effect: NoSchedule 

# values-argocd.yaml (staging)
# configs:
#   cm:
#     application:
#       instanceLabelKey: argocd.argoproj.io/staging-instance 

configs:
  # argocd-cm is owned by the argocd-rbac app (helm-charts infra-charts/argocd-rbac-operator):
  # url, oidc, installationID, tracking method. Don't let this chart render it.
  cm:
    create: false
  # argocd-secret holds server.secretkey (generated by argocd-server) and oidc.google.clientSecret
  # (used by argocd-cm oidc.config). Chart-managed, a sync rewrote it to admin.password only and
  # broke reconciliation + SSO during the v3.3.2 upgrade. Keep it out of the chart.
  secret:
    createSecret: false
  params:
    create: true
    application.instanceLabelKey: argocd.argoproj.io/staging-instance
  
  rbac:
    scopes: "[groups, email]"